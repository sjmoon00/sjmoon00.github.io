    <rect x="508" y="100" width="220" height="160" rx="16" fill="#ffffff"/>
    <path d="M332 180h126"/>
    <path d="M442 163l20 17-20 17" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
  <g fill="#282828" font-family="system-ui, sans-serif" text-anchor="middle">
    <text x="182" y="170" font-size="26" font-weight="700">assets/</text>
