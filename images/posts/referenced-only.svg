<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 360" role="img" aria-labelledby="title desc">
  <title id="title">참조 기반 이미지 공개</title>
  <desc id="desc">assets 이미지가 공개 글에서 참조될 때만 산출물에 포함되는 흐름</desc>
  <rect width="800" height="360" fill="#f7f6f3"/>
  <g fill="none" stroke="#555555" stroke-width="3">
